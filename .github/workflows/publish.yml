name: publish-image

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Extract version from Dockerfile
        run: |
          VERSION=$(grep -oP '(?<=ARG VERSION=).*' Dockerfile)
          echo "version is $VERSION"
          echo "DOCKER_TAG=$VERSION" >> $GITHUB_ENV
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/armhf, linux/arm
          provenance: false
          push: true
          tags: |
            wisdomsky/playit-docker-web:${{ env.DOCKER_TAG }},
            wisdomsky/playit-docker-web:latest
